# ============================================================
# 产线服务优化配置片段
# 用法：先执行 paddlex --get_pipeline_config PaddleOCR-VL 生成 PaddleOCR-VL.yaml，
#       若生成的文件中【没有】Serving 字段，直接将本文件内容追加到文件末尾；
#       若【已有】Serving 字段，请手动合并，不要出现两个顶层 Serving 字段。
# ============================================================
Serving:
  # 关闭可视化结果图返回（默认会返回版面框可视化图，增加显存与传输开销）
  visualize: False
  extra:
    # PDF / 多页 TIFF 的最大处理页数，防止超大文档把服务打垮
    # 按需调整；设为 null 表示不限制
    max_num_input_imgs: 50
